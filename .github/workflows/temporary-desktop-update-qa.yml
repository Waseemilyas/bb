name: Approved stack native UI QA
on:
  push:
    branches:
      - bb/updates-5492-native-ui-qa
concurrency:
  group: desktop-update-qa-${{ github.sha }}
  cancel-in-progress: false
env:
  PNPM_VERSION: "9.15.0"
  QA_PRODUCT_HEAD: "d3d9d771a1d2decb4a25720eebaf002a2f81b117"
jobs:
  package-smoke:
    name: Package Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            node-version: "22.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the exact candidate AppImages
        uses: actions/download-artifact@v4
        with:
          name: desktop-update-qa
          run-id: 38652660602
          github-token: ${{ github.token }}
          path: apps/desktop/release/update-qa/

      - name: Install AppImage FUSE runtime
        uses: ./.github/actions/install-appimage-fuse
        with:
          package: libfuse2t64

      - name: Install isolated Chrome for Testing driver
        run: |
          QA_BROWSER_DIR=$(mktemp -d)
          echo "QA_BROWSER_DIR=$QA_BROWSER_DIR" >> "$GITHUB_ENV"
          npm install --prefix "$QA_BROWSER_DIR" --no-audit --no-fund puppeteer@24.37.5

      - name: Exercise real desktop server update
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a node apps/desktop/scripts/temporary-update-qa-run.mjs

      - name: Upload isolated desktop update QA artifacts
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-update-qa
          path: apps/desktop/release/update-qa/
          compression-level: 0
          retention-days: 3

